[project]
name = "nemotron-investigator"
version = "0.1.0"
description = "LOCKI AIRLOCK - Nemotron multi-step, read-only security investigation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
relay = ["nemo-relay==0.11.1"]   # install hash-pinned via requirements-relay.txt

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real local Ollama/Nemotron (opt-in with -m live)"]
addopts = "-m 'not live'"
